plugins { id 'com.android.library'; id 'maven-publish' }
def defaultServer = providers.gradleProperty('openpushDefaultServerUrl')
        .orElse(providers.environmentVariable('OPENPUSH_SERVER_URL')).getOrElse('')
def debugServer = providers.gradleProperty('openpushDebugServerUrl').getOrElse('')
android {
    buildFeatures { buildConfig = true }
    namespace 'io.openpush.sdk'
    compileSdk 35
    publishing { singleVariant('release') { withSourcesJar() } }
    defaultConfig {
        minSdk 21
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + defaultServer.replace('\\','\\\\').replace('"','\\"') + '"'
        buildConfigField 'String', 'DEBUG_SERVER_URL', '"' + debugServer.replace('\\','\\\\').replace('"','\\"') + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests.includeAndroidResources = true }
}
// A one-line public API must not be published with an invented/missing backend.
tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenLocal).configureEach {
    doFirst {
        URI endpoint
        try { endpoint = new URI(defaultServer) } catch (Exception ignored) { }
        if (!debugServer.isEmpty() || endpoint == null || endpoint.scheme != 'https' || !endpoint.host || endpoint.userInfo
                || endpoint.query || endpoint.fragment || !(endpoint.path in ['', '/'])) {
            throw new GradleException('OpenPush publication requires a real HTTPS origin via openpushDefaultServerUrl or OPENPUSH_SERVER_URL and no openpushDebugServerUrl. Local Verification publishing remains available for USB tests.')
        }
    }
}
afterEvaluate { publishing { publications { sdk(MavenPublication) { from components.release } } } }
dependencies {
    api project(':core')
    implementation 'androidx.core:core:1.13.1'
    // Host owns Firebase runtime versions. Do not export a BoM or upgrade its libraries.
    api 'com.google.firebase:firebase-messaging:23.4.1'
    testImplementation 'com.google.firebase:firebase-messaging:23.4.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'com.google.firebase:firebase-messaging:23.4.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
