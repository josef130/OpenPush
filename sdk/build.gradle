plugins { id 'com.android.library'; id 'maven-publish' }
def defaultServer = providers.gradleProperty('openpushDefaultServerUrl')
        .orElse(providers.environmentVariable('OPENPUSH_SERVER_URL')).getOrElse('')
def debugServer = providers.gradleProperty('openpushDebugServerUrl').getOrElse('')
def central = new Properties()
def centralFile = rootProject.file('central-firebase.properties')
if (centralFile.isFile()) centralFile.withInputStream { central.load(it) }
android {
    buildFeatures { buildConfig = true }
    namespace 'io.openpush.sdk'
    compileSdk 35
    publishing { singleVariant('release') { withSourcesJar() } }
    defaultConfig {
        minSdk 21
        ['PROJECT_ID':'projectId','APPLICATION_ID':'applicationId','API_KEY':'apiKey'].each { field, key ->
            buildConfigField 'String', 'CENTRAL_' + field, '"' + central.getProperty(key,'').replace('\\','\\\\').replace('"','\\"') + '"'
        }
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + defaultServer.replace('\\','\\\\').replace('"','\\"') + '"'
        buildConfigField 'String', 'DEBUG_SERVER_URL', '"' + debugServer.replace('\\','\\\\').replace('"','\\"') + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests.includeAndroidResources = true }
}
// Root verifyOpenPushPublication guards every public module before publication.
afterEvaluate { publishing { publications { sdk(MavenPublication) { from components.release } } } }
dependencies {
    api project(':core')
    implementation 'androidx.core:core:1.13.1'
    // Host owns Firebase runtime versions. Do not export a BoM or upgrade its libraries.
    api 'com.google.firebase:firebase-messaging:23.4.1'
    testImplementation 'com.google.firebase:firebase-messaging:23.4.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'com.google.firebase:firebase-messaging:23.4.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
